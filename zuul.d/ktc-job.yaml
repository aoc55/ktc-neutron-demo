# ================================================
# - Project: ktc-neutron
# ================================================
- job:
    name: ktc-neutron-functional
    parent: neutron-functional
    timeout: 9000     # KTC 임시 상향
    required-projects:
      - aoc55/ktc-neutron-demo
    vars:
      base_dir: "{{ ansible_user_dir }}/src/github.com/aoc55"
      gate_dest_dir: "{{ ansible_user_dir }}/src/github.com/aoc55"
      devstack_dir: "{{ ansible_user_dir }}/src/opendev.org/openstack/devstack"
      neutron_dir: "{{ ansible_user_dir }}/src/github.com/aoc55/ktc-neutron-demo"
      project_name: "ktc-neutron-demo"
      zuul_copy_output:
        '/opt/stack/logs/dsvm-functional-logs.tar.gz': logs

- job:
    name: ktc-neutron-fullstack
    parent: neutron-functional
    timeout: 120000     # KTC 임시 상향
    required-projects:
      - aoc55/ktc-neutron-demo
    vars:
      base_dir: "{{ ansible_user_dir }}/src/github.com/aoc55"
      gate_dest_dir: "{{ ansible_user_dir }}/src/github.com/aoc55"
      devstack_dir: "{{ ansible_user_dir }}/src/opendev.org/openstack/devstack"
      neutron_dir: "{{ ansible_user_dir }}/src/github.com/aoc55/ktc-neutron-demo"
      project_name: "ktc-neutron-demo"
      zuul_copy_output:
        '/opt/stack/logs/dsvm-functional-logs.tar.gz': logs

